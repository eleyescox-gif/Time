plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 34
    namespace 'com.mymasjid.tv'

    defaultConfig {
        applicationId "com.mymasjid.tv"
        // China-brand TV: API 21 থেকে চলবে
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.0.1"
    }

    signingConfigs {
        release {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Low-spec TV: dex split কমাতে
    defaultConfig {
        multiDexEnabled false
    }
}

dependencies {
    // Android TV Leanback UI (D-pad navigation)
    implementation 'androidx.leanback:leanback:1.0.0'

    // AppCompat (Theme switching)
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Core KTX
    implementation 'androidx.core:core-ktx:1.12.0'

    // Fragment
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // ConstraintLayout
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // WorkManager (Pre-Jamaat notification scheduling)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // SharedPreferences (settings)
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Lifecycle (for service awareness)
    implementation 'androidx.lifecycle:lifecycle-service:2.6.2'

    // CardView (prayer time cards)
    implementation 'androidx.cardview:cardview:1.0.0'

    testImplementation 'junit:junit:4.13.2'
}
